[workspace]
resolver = "3"
members = ["apps/Konclave.CommandLine", "apps/Konclave.CommunityRelay", "apps/Konclave.LocalDaemon", "crates/Konclave.AdapterTransport", "crates/Konclave.ClientLibrary", "crates/Konclave.CryptographicCore", "crates/Konclave.DomainCore", "crates/Konclave.LocalFraming", "crates/Konclave.LocalServiceTransport", "crates/Konclave.ProtocolContracts", "crates/Konclave.RelayAuthentication", "crates/Konclave.RelayCore", "crates/Konclave.SecretStorage", "crates/Konclave.WindowsSecurity"]

[workspace.dependencies]
async-trait = "0.1.92"
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["alloc", "aws-lc-sys"] }
base64 = "0.22.1"
futures-util = "0.3.34"
fs4 = "1.1.0"
keyring = "=4.1.6"
log = { version = "0.4.33", features = ["max_level_debug", "release_max_level_info"] }
mls-rs = { version = "=0.55.3", default-features = false, features = ["std", "rfc_compliant", "tree_index", "fast_serialize"] }
mls-rs-core = { version = "=0.27.0", default-features = false, features = ["std", "rfc_compliant", "fast_serialize"] }
mls-rs-crypto-awslc = "=0.25.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls"], default-features = false }
thiserror = "2.0.20"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2.5.8"
windows-sys = "0.61.2"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
