[workspace]
resolver = "3"
members = ["apps/Konclave.CommandLine", "apps/Konclave.CommunityRelay", "apps/Konclave.LocalDaemon", "crates/Konclave.ClientLibrary", "crates/Konclave.CryptographicCore", "crates/Konclave.DomainCore", "crates/Konclave.ProtocolContracts", "crates/Konclave.RelayCore", "crates/Konclave.SecretStorage"]

[workspace.dependencies]
async-trait = "0.1.92"
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["alloc", "aws-lc-sys"] }
base64 = "0.22.1"
keyring = "=4.1.6"
mls-rs = { version = "=0.55.3", default-features = false, features = ["std", "rfc_compliant", "tree_index", "fast_serialize"] }
mls-rs-core = { version = "=0.27.0", default-features = false, features = ["std", "rfc_compliant", "fast_serialize"] }
mls-rs-crypto-awslc = "=0.25.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls"], default-features = false }
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
