syntax = "proto3";

package konclave.protocol.v1;

import "konclave/protocol/v1/common.proto";

// Identifies one immutable canonical collaboration-policy bundle.
message CollaborationPolicyDigest {
  // Exactly 32 SHA-256 bytes in protocol v1.
  bytes value = 1;
}

// Identifies one collaboration-policy proposal exchange.
message CollaborationPolicyProposalId {
  // Exactly 16 bytes in protocol v1.
  bytes value = 1;
}

// Defines one evaluator primitive without hardcoding named collaboration modes.
enum CollaborationPolicyEffect {
  COLLABORATION_POLICY_EFFECT_UNSPECIFIED = 0;
  COLLABORATION_POLICY_EFFECT_ALLOW = 1;
  COLLABORATION_POLICY_EFFECT_DENY = 2;
  COLLABORATION_POLICY_EFFECT_REQUIRE_LOCAL_APPROVAL = 3;
}

// Applies one decision primitive to a namespaced action and optional resource.
message CollaborationPolicyStatement {
  string statement_id = 1;
  CollaborationPolicyEffect effect = 2;
  string action = 3;
  optional string resource = 4;
}

// Carries fully resolved semantic limits. Absent fields mean explicitly unlimited.
message CollaborationPolicyLimits {
  optional uint64 duration_milliseconds = 1;
  optional uint64 turns = 2;
  optional uint64 tokens = 3;
  optional uint32 concurrent_requests = 4;
}

// Canonical source-independent collaboration policy.
message CollaborationPolicyBundle {
  ProtocolVersion version = 1;
  string name = 2;
  // Legacy untrusted annotation retained only for historical byte and digest compatibility.
  optional string guidance = 3;
  repeated CollaborationPolicyStatement statements = 4;
  repeated string required_harness_claims = 5;
  CollaborationPolicyLimits limits = 6;
}

// Proposes one complete canonical policy bundle without activating it remotely.
message CollaborationPolicyProposal {
  CollaborationPolicyProposalId proposal_id = 1;
  CollaborationPolicyDigest policy_digest = 2;
  bytes canonical_bundle = 3;
  CollaborationPolicyDigest replaces_policy_digest = 4;
}

// Defines the terminal local response to one proposal.
enum CollaborationPolicyResponseOutcome {
  COLLABORATION_POLICY_RESPONSE_OUTCOME_UNSPECIFIED = 0;
  COLLABORATION_POLICY_RESPONSE_OUTCOME_ACCEPTED = 1;
  COLLABORATION_POLICY_RESPONSE_OUTCOME_REJECTED = 2;
}

// Acknowledges one exact proposal and base digest.
message CollaborationPolicyResponse {
  CollaborationPolicyProposalId proposal_id = 1;
  CollaborationPolicyDigest policy_digest = 2;
  CollaborationPolicyResponseOutcome outcome = 3;
}

// Announces removal of one endpoint's local policy binding.
message CollaborationPolicyRevocation {
  CollaborationPolicyDigest policy_digest = 1;
}
