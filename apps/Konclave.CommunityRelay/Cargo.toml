[package]
name = "KonclaveCommunityRelay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8.9", features = ["http1", "json", "matched-path", "tokio", "ws"], optional = true }
axum-server = { version = "0.8.0", optional = true }
futures-util = { version = "0.3.34", features = ["sink"], optional = true }
libc = { version = "0.2.189", optional = true }
opentelemetry = { version = "0.32.0", features = ["trace"], default-features = false, optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace"], default-features = false, optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"], default-features = false, optional = true }
rmcp = { version = "3.1.2", features = ["client", "server", "transport-io"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "sqlite"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"], optional = true }
windows-service = { version = "0.8.1", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["rust-service-http", "rust-service-observability", "rust-service-sqlite", "rust-service-websocket"]
rust-service-http = ["dep:axum", "dep:axum-server", "dep:serde", "dep:serde_json"]
rust-service-websocket = ["dep:futures-util"]
rust-service-sqlite = ["dep:sqlx"]
rust-service-observability = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]
