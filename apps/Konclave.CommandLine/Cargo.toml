[package]
name = "KonclaveCommandLine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
KonclaveCollaborationPolicies = { path = "../../crates/Konclave.CollaborationPolicies" }
KonclaveClientLibrary = { path = "../../crates/Konclave.ClientLibrary" }
KonclaveCryptographicCore = { path = "../../crates/Konclave.CryptographicCore" }
KonclaveDomainCore = { path = "../../crates/Konclave.DomainCore" }
KonclaveLocalServiceTransport = { path = "../../crates/Konclave.LocalServiceTransport" }
KonclaveSecretStorage = { path = "../../crates/Konclave.SecretStorage" }
anyhow = "1.0.104"
base64.workspace = true
clap = { version = "4.6.4", features = ["derive"] }
rpassword = "=7.5.4"
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
zeroize.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
