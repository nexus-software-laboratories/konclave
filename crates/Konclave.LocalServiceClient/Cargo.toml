[package]
name = "KonclaveLocalServiceClient"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
KonclaveBoundedDocuments = { path = "../Konclave.BoundedDocuments" }
KonclaveCryptographicCore = { path = "../Konclave.CryptographicCore" }
KonclaveDomainCore = { path = "../Konclave.DomainCore" }
KonclaveLocalServiceTransport = { path = "../Konclave.LocalServiceTransport" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
