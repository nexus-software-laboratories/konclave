[package]
name = "KonclaveLocalServiceTransport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
KonclaveCryptographicCore = { path = "../Konclave.CryptographicCore" }
KonclaveDomainCore = { path = "../Konclave.DomainCore" }
KonclaveLocalFraming = { path = "../Konclave.LocalFraming" }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "net", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
KonclaveWindowsSecurity = { path = "../Konclave.WindowsSecurity" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
