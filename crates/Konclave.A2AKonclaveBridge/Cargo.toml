[package]
name = "KonclaveA2AKonclaveBridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
KonclaveA2AContracts = { path = "../Konclave.A2AContracts" }
KonclaveA2ADomain = { path = "../Konclave.A2ADomain" }
KonclaveA2AGateway = { path = "../Konclave.A2AGateway" }
KonclaveA2ATaskStore = { path = "../Konclave.A2ATaskStore" }
KonclaveBoundedDocuments = { path = "../Konclave.BoundedDocuments" }
KonclaveCryptographicCore = { path = "../Konclave.CryptographicCore" }
KonclaveLocalServiceClient = { path = "../Konclave.LocalServiceClient" }
KonclaveLocalServiceTransport = { path = "../Konclave.LocalServiceTransport" }
async-trait.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
KonclaveA2ADiscovery = { path = "../Konclave.A2ADiscovery" }
KonclaveA2ATaskStoreSqlite = { path = "../Konclave.A2ATaskStoreSqlite" }
KonclaveDomainCore = { path = "../Konclave.DomainCore" }
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
