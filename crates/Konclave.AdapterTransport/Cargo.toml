[package]
name = "KonclaveAdapterTransport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
KonclaveCryptographicCore = { path = "../Konclave.CryptographicCore" }
base64.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "net", "time"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
