[package]
name = "KonclaveClientLibrary"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
KonclaveCryptographicCore = { path = "../Konclave.CryptographicCore" }
KonclaveDomainCore = { path = "../Konclave.DomainCore" }
KonclaveProtocolContracts = { path = "../Konclave.ProtocolContracts" }
KonclaveProtectedHttp = { path = "../Konclave.ProtectedHttp" }
KonclaveRelayAuthentication = { path = "../Konclave.RelayAuthentication" }
KonclaveSecretStorage = { path = "../Konclave.SecretStorage", default-features = false }
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
log.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["fs"] }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["net", "time"] }
tokio-tungstenite.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
KonclaveCommunityRelay = { path = "../../apps/Konclave.CommunityRelay" }
KonclaveRelayCore = { path = "../Konclave.RelayCore" }
axum = "0.8.9"
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
