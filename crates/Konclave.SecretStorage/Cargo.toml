[package]
name = "KonclaveSecretStorage"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[features]
default = ["native-keyring", "sqlite"]
native-keyring = ["dep:keyring"]
sqlite = ["dep:rusqlite"]

[dependencies]
aws-lc-rs.workspace = true
keyring = { workspace = true, optional = true }
mls-rs-core.workspace = true
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
KonclaveWindowsSecurity = { path = "../Konclave.WindowsSecurity" }

[dev-dependencies]
tempfile = "3.27.0"
