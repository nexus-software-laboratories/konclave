name: Release-pinned Rust setup
description: Installs the Rust toolchain declared by the release artifact manifest.

inputs:
  components:
    description: Optional Rust components to install.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve release Rust toolchain
      id: release
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $manifest = Get-Content -LiteralPath distribution/release-artifacts.json -Raw
        if (-not ($manifest | Test-Json -SchemaFile distribution/release-artifacts.schema.json)) {
          throw 'Release artifact manifest does not satisfy its schema.'
        }
        $release = $manifest | ConvertFrom-Json -Depth 100
        "toolchain=$($release.release.toolchains.rust)" >>$env:GITHUB_OUTPUT
    - name: Install release Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.release.outputs.toolchain }}
        components: ${{ inputs.components }}
