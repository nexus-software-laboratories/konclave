name: Pairing rendezvous conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pairing-rendezvous-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pairing-rendezvous-conformance:
    name: Pairing rendezvous conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve pairing rendezvous validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for pairing rendezvous conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/genesis-delivery\.json$' -or
                $_ -match '^\.github/workflows/pairing-rendezvous-conformance\.yml$' -or
                $_ -match '^docs/adr/adr-0023-encrypted-pairing-rendezvous\.md$' -or
                $_ -match '^docs/development/conformance\.md$' -or
                $_ -match '^proto/konclave/protocol/v1/pairing_rendezvous\.proto$' -or
                $_ -match '^fixtures/local-service/v1/copilot-tools\.json$' -or
                $_ -match '^crates/Konclave\.(?:ClientLibrary|CryptographicCore|DomainCore|ProtocolContracts|RelayCore|SecretStorage)/(?:Cargo\.toml|build\.rs|src/.*|tests/.*)$' -or
                $_ -match '^apps/Konclave\.(?:CommunityRelay|LocalDaemon)/(?:Cargo\.toml|src/.*|tests/.*)$' -or
                $_ -match '^extensions/Konclave\.HostExtension/(?:package(?:-lock)?\.json|src/.*|tests/.*)$'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: pairing-rendezvous-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          npm-cache-scope: pairing-rendezvous-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Verify pairing rendezvous integration
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --package KonclaveClientLibrary \
            --package KonclaveCommunityRelay \
            --package KonclaveCryptographicCore \
            --package KonclaveDomainCore \
            --package KonclaveLocalDaemon \
            --package KonclaveProtocolContracts \
            --package KonclaveRelayCore \
            -- \
            --check
          cargo test \
            --locked \
            --package KonclaveDomainCore \
            pairing_rendezvous
          cargo test \
            --locked \
            --package KonclaveCryptographicCore \
            pairing_rendezvous
          cargo test \
            --locked \
            --package KonclaveProtocolContracts \
            pairing_rendezvous
          cargo test \
            --locked \
            --package KonclaveRelayCore
          cargo test \
            --locked \
            --package KonclaveCommunityRelay \
            --test http_integration \
            pairing_rendezvous
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            pairing_rendezvous
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            --test http_safety \
            clients_never_forward_bearer_credentials_across_redirects
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            pairing_service::tests::compact_rendezvous_completes_one_shared_conversation
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            pairing_service::tests::failed_rendezvous_publish_cancels_the_local_reservation
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            pairing_service::tests::compact_rendezvous_rejects_administrator_capabilities
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            mcp::tests::copilot_tool_contract_fixture_matches_the_router
          cargo clippy \
            --locked \
            --package KonclaveCommunityRelay \
            --package KonclaveCryptographicCore \
            --package KonclaveDomainCore \
            --package KonclaveClientLibrary \
            --package KonclaveLocalDaemon \
            --package KonclaveProtocolContracts \
            --package KonclaveRelayCore \
            --all-targets \
            -- \
            -D warnings
          npm --prefix extensions/Konclave.HostExtension ci --no-audit --no-fund
          npm --prefix extensions/Konclave.HostExtension test
