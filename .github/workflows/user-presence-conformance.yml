name: User presence conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: user-presence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  user-presence-conformance:
    name: User presence conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve user-presence validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for user-presence conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/workflows/user-presence-conformance\.yml$' -or
                $_ -match '^apps/Konclave\.CommandLine/' -or
                $_ -match '^apps/Konclave\.LocalDaemon/(?:Cargo\.toml|src/(?:authorization_runtime|local_service)\.rs)$' -or
                $_ -match '^crates/Konclave\.DomainCore/' -or
                $_ -match '^crates/Konclave\.LocalAuthorizationStore/' -or
                $_ -match '^crates/Konclave\.LocalServiceTransport/' -or
                $_ -match '^crates/Konclave\.SecretStorage/' -or
                $_ -match '^crates/Konclave\.UserPresence/' -or
                $_ -match '^extensions/Konclave\.HostExtension/' -or
                $_ -match '^scripts/packaging/Test-ReleasePackaging\.ps1$'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: user-presence-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve pinned Node version
        if: steps.scope.outputs.run == 'true'
        id: toolchains
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - name: Install Node
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          npm-cache-scope: user-presence-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Verify user-presence decision core
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --package KonclaveCommandLine \
            --package KonclaveLocalDaemon \
            --package KonclaveLocalAuthorizationStore \
            --package KonclaveLocalServiceTransport \
            --package KonclaveUserPresence \
            -- \
            --check
          cargo test \
            --locked \
            --package KonclaveCommandLine \
            --package KonclaveLocalAuthorizationStore \
            --package KonclaveLocalServiceTransport \
            --package KonclaveUserPresence
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            user_presence_
          cargo clippy \
            --locked \
            --package KonclaveCommandLine \
            --package KonclaveLocalAuthorizationStore \
            --package KonclaveLocalServiceTransport \
            --package KonclaveUserPresence \
            --all-targets \
            -- \
            -D warnings
          cargo clippy \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            -- \
            -D warnings
      - name: Verify user-presence client and helper contract
        if: steps.scope.outputs.run == 'true'
        working-directory: extensions/Konclave.HostExtension
        run: |
          npm ci
          npm test
