name: CI

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation scope for this branch dispatch'
        required: false
        default: 'full'
        type: choice
        options: [full, subset]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Under pull_request_target, github.ref resolves to the base branch, so keying on
  # it alone puts every open pull request in one group. GitHub keeps only one pending
  # run per group, so a third request silently cancels another pull request's queued
  # validation.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded revisions queue rather than cancel, so a run that is already producing
  # required checks finishes and reports.
  cancel-in-progress: false

jobs:
  source-policy:
    name: PR source policy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [linux, x64, automation-control]
    timeout-minutes: 5
    steps:
      - name: Reject untrusted fork execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request_target' ] &&
             { [ -z "$HEAD_REPOSITORY" ] ||
               [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; }; then
            echo '::error::Fork pull requests cannot execute untrusted code on PitCrew. A maintainer must reproduce the change on a repository branch.'
            exit 1
          fi
          echo 'Pull request source is eligible for PitCrew execution.'

  validation-plan:
    needs: source-policy
    if: needs.source-policy.result == 'success'
    uses: ./.github/workflows/guidance-validation-plan.yml
    with:
      event_name: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
      pull_request_number: ${{ github.event.pull_request.number || 0 }}
      is_draft: ${{ github.event.pull_request.draft || false }}
      requested_scope: ${{ inputs.validation_scope || '' }}
      draft_mode: ${{ vars.CI_DRAFT_MODE || 'full' }}

  rust-build-test:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Build and test Rust workspace
    runs-on: [self-hosted, linux, x64, general-purpose]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo test -p KonclaveSecretStorage --no-default-features
      - run: cargo test -p KonclaveSecretStorage --no-default-features --features sqlite
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bin protocol_v1_decode

  rust-lint:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Rust rustfmt + clippy
    runs-on: [self-hosted, linux, x64, general-purpose]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: bash ./scripts/ci/Validate-RustSecurityDependencies.sh
      - run: pwsh ./scripts/protocol/Test-ProtocolRelease.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p KonclaveSecretStorage --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p KonclaveSecretStorage --no-default-features --features sqlite --all-targets -- -D warnings
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bin protocol_v1_decode -- -D warnings

  node-build-and-test:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Build and test Node guests
    runs-on: [self-hosted, linux, x64, general-purpose]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          npm-cache-scope: ${{ github.job }}
          npm-cache-dependency-hash: ${{ hashFiles('apps/**/package-lock.json', 'extensions/**/package-lock.json', 'packages/**/package-lock.json') }}

      - name: Build and test Node guests
        shell: pwsh
        run: ./scripts/Invoke-NodeWorkspaceChecks.ps1

  community-relay-container-ci:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Container CI (community-relay)
    # This repository is public, so container validation uses free hosted capacity
    # and never depends on self-hosted image-builder availability.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONTAINER_VALIDATION_BUILDER: konclave-container-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize container validation paths
        shell: bash
        run: >-
          bash ./scripts/ci/Initialize-JobPrivatePaths.sh
          CONTAINER_VALIDATION_ROOT=konclave-container-validation
      - name: Build and validate AMD64 OCI archive
        shell: bash
        run: >-
          bash ./scripts/ci/Validate-HostedContainerImage.sh
          apps/Konclave.CommunityRelay
          konclave-community-relay
      # Cleanup is unconditional so no builder, cache, or archive survives the job.
      - name: Remove container validation state
        if: always()
        shell: bash
        run: bash ./scripts/ci/Cleanup-HostedContainerImage.sh

  local-daemon-daemon-packaging:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Daemon packaging (local-daemon)
    runs-on: [self-hosted, linux, x64, general-purpose]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check Windows Service host source
        working-directory: apps/Konclave.LocalDaemon
        run: cargo check --bin windows_service
      - name: Validate daemon package definitions
        shell: pwsh
        working-directory: apps/Konclave.LocalDaemon
        run: |
          $unit = 'packaging/systemd/KonclaveLocalDaemon-daemon.service'
          $unitLines = Get-Content -LiteralPath $unit
          foreach ($expected in @('Type=simple', 'Restart=on-failure')) {
            if ($expected -cnotin $unitLines) {
              throw "systemd unit is missing '$expected'."
            }
          }
          if (-not ($unitLines | Where-Object { $_ -clike 'ExecStart=*' })) {
            throw 'systemd unit is missing ExecStart.'
          }

          $plistPath = 'packaging/launchd/com.genesis.KonclaveLocalDaemon.plist'
          [xml]$plist = Get-Content -LiteralPath $plistPath -Raw
          if ($plist.plist.version -ne '1.0' -or $null -eq $plist.plist.dict) {
            throw 'launchd property list is not a plist dictionary.'
          }

          $installer = 'packaging/windows/install-service.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $installer),
              [ref]$tokens,
              [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ($errors.Message -join [Environment]::NewLine)
          }

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }}
    needs:
      - source-policy
      - validation-plan
      - rust-build-test
      - rust-lint
      - node-build-and-test
      - community-relay-container-ci
      - local-daemon-daemon-packaging
    if: >-
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: [linux, x64, automation-control]
    timeout-minutes: 5
    steps:
      - name: Check validation results
        env:
          SOURCE_RESULT: ${{ needs.source-policy.result }}
          SCOPE: ${{ needs.validation-plan.outputs.scope }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          RUST_BUILD_RESULT: ${{ needs.rust-build-test.result }}
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          NODE_RESULT: ${{ needs.node-build-and-test.result }}
          CONTAINER_RESULT: ${{ needs.community-relay-container-ci.result }}
          DAEMON_PACKAGING_RESULT: ${{ needs.local-daemon-daemon-packaging.result }}
        run: |
          if [ "$SOURCE_RESULT" != "success" ]; then exit 1; fi
          if [ "$PLAN_RESULT" != "success" ]; then exit 1; fi
          for result in \
            "$RUST_BUILD_RESULT" \
            "$RUST_LINT_RESULT" \
            "$NODE_RESULT" \
            "$CONTAINER_RESULT" \
            "$DAEMON_PACKAGING_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
          if [ "$SCOPE" = "full" ] && [ "$RUST_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$RUST_LINT_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$NODE_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$CONTAINER_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$DAEMON_PACKAGING_RESULT" != "success" ]; then exit 1; fi
          echo "Validation scope '$SCOPE' passed."
