name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Validation scope for this branch dispatch'
        required: false
        default: 'full'
        type: choice
        options: [full, subset]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-policy:
    name: PR source policy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted validation boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'pull_request' ] &&
             [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            echo "::error::Unsupported CI event: $EVENT_NAME"
            exit 1
          fi
          echo 'Public pull-request code runs only on GitHub-hosted runners.'

  validation-plan:
    needs: source-policy
    if: ${{ needs.source-policy.result == 'success' && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
    uses: ./.github/workflows/guidance-validation-plan.yml
    with:
      event_name: ${{ github.event_name }}
      pull_request_number: ${{ github.event.pull_request.number || 0 }}
      is_draft: ${{ github.event.pull_request.draft || false }}
      requested_scope: ${{ inputs.validation_scope || '' }}
      draft_mode: ready-only

  guidance-policy:
    needs: validation-plan
    if: needs.validation-plan.result == 'success'
    name: Agent delivery policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify security-sensitive delivery policy
        shell: pwsh
        run: ./scripts/ci/Test-SecuritySensitiveDeliveryPolicy.ps1
      - name: Verify Actions storage policy
        shell: pwsh
        run: ./scripts/ci/Test-ActionsStoragePolicy.ps1
      - name: Verify CI performance evidence
        shell: pwsh
        run: ./scripts/ci/Test-CiPerformanceEvidence.ps1
      - name: Verify component validation scope
        shell: pwsh
        run: ./scripts/ci/Test-ComponentValidationScope.ps1
      - name: Verify CI work deduplication
        shell: pwsh
        run: ./scripts/ci/Test-CiWorkDeduplication.ps1

  dependabot-validation:
    needs: source-policy
    if: ${{ needs.source-policy.result == 'success' && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    name: Dependabot validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dependency update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve dependency validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $files = @(
            gh api --paginate `
              "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
              --jq '.[] | .filename, (.previous_filename // empty)'
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve Dependabot pull-request files.'
          }
          $scope = ./scripts/ci/Resolve-DependabotValidation.ps1 -ChangedFiles $files
          "cargo=$($scope.Cargo.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
          "node=$($scope.Node.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
          "actions=$($scope.Actions.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
          Write-Host "Dependabot scope: cargo=$($scope.Cargo), node=$($scope.Node), actions=$($scope.Actions)"
      - name: Install Rust
        if: steps.scope.outputs.cargo == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache Rust dependencies
        if: steps.scope.outputs.cargo == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: dependabot-cargo
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate Cargo dependency update
        if: steps.scope.outputs.cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked
          cargo check --workspace --all-targets --locked
          cargo check --locked --manifest-path fuzz/Cargo.toml --bin protocol_v1_decode
          bash ./scripts/ci/Validate-RustSecurityDependencies.sh
      - name: Setup Node.js
        if: steps.scope.outputs.node == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          npm-cache-scope: dependabot-node
          npm-cache-dependency-hash: ${{ hashFiles('apps/**/package-lock.json', 'extensions/**/package-lock.json', 'packages/**/package-lock.json') }}
      - name: Validate Node dependency update
        if: steps.scope.outputs.node == 'true'
        shell: pwsh
        run: ./scripts/Invoke-NodeWorkspaceChecks.ps1
      - name: Validate GitHub Actions dependency update
        if: steps.scope.outputs.actions == 'true'
        shell: pwsh
        run: |
          ./scripts/ci/Test-DependabotValidation.ps1
          ./scripts/ci/Test-DependabotWorkflowIsolation.ps1
          ./scripts/ci/Test-PullRequestValidationTriggers.ps1
          ./scripts/ci/Test-SecuritySensitiveDeliveryPolicy.ps1
          ./scripts/ci/Test-ActionsStoragePolicy.ps1

  rust-build-test:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Build and test Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --verbose
      - run: cargo test -p KonclaveSecretStorage --no-default-features
      - run: cargo test -p KonclaveSecretStorage --no-default-features --features sqlite

  rust-lint:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Rust rustfmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - name: Verify pull-request validation trigger contract
        shell: pwsh
        run: |
          ./scripts/ci/Test-PullRequestValidationTriggers.ps1
          ./scripts/ci/Test-DependabotValidation.ps1
          ./scripts/ci/Test-DependabotWorkflowIsolation.ps1
      - run: bash ./scripts/ci/Validate-RustSecurityDependencies.sh
      - run: pwsh ./scripts/protocol/Test-ProtocolRelease.ps1
      - run: pwsh ./scripts/a2a/Test-A2AProvenance.ps1
      - run: pwsh ./scripts/a2a/Test-A2AFixtures.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p KonclaveSecretStorage --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p KonclaveSecretStorage --no-default-features --features sqlite --all-targets -- -D warnings
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bin protocol_v1_decode -- -D warnings

  node-build-and-test:
    needs: validation-plan
    if: needs.validation-plan.outputs.scope == 'full'
    name: Build and test Node guests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          npm-cache-scope: ${{ github.job }}
          npm-cache-dependency-hash: ${{ hashFiles('apps/**/package-lock.json', 'extensions/**/package-lock.json', 'packages/**/package-lock.json') }}

      - name: Build and test Node guests
        shell: pwsh
        run: ./scripts/Invoke-NodeWorkspaceChecks.ps1

  # These named jobs are branch-protection contexts. Guidance-only pull requests
  # publish a lightweight success instead of leaving the context skipped.
  container-ci:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.scope == 'full' || needs.validation-plan.outputs.scope == 'guidance' }}
    name: Container CI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: community-relay
            applicationRoot: apps/Konclave.CommunityRelay
            imageName: konclave-community-relay
          - name: a2a-gateway
            applicationRoot: apps/Konclave.A2AGateway
            imageName: konclave-a2a-gateway
    # This repository is public, so container validation uses free hosted capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish guidance-only required check
        if: needs.validation-plan.outputs.scope == 'guidance'
        run: echo 'Container validation is not required for guidance-only changes.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.validation-plan.outputs.scope == 'full'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize container validation paths
        if: needs.validation-plan.outputs.scope == 'full'
        shell: bash
        run: >-
          bash ./scripts/ci/Initialize-JobPrivatePaths.sh
          CONTAINER_VALIDATION_ROOT=konclave-container-validation
      # The cleanup contract is exercised against a real engine before anything is
      # built, so a filter that removes too much is caught while the only resources at
      # risk are the throwaway ones this test made.
      - name: Verify container validation cleanup contract
        if: needs.validation-plan.outputs.scope == 'full'
        shell: bash
        run: |
          bash ./scripts/ci/Test-ContainerImageContract.sh
          if [ '${{ matrix.name }}' = 'a2a-gateway' ]; then
            bash ./scripts/ci/Test-A2AGatewayContainerContract.sh \
              'konclave-a2a-gateway:0.1.14'
          fi
          bash ./scripts/ci/Test-ContainerValidationCleanup.sh
      - name: Capture Docker baseline
        if: needs.validation-plan.outputs.scope == 'full'
        shell: bash
        run: >-
          bash ./scripts/ci/Capture-ContainerValidationBaseline.sh
      - name: Build and validate AMD64 OCI archive
        if: needs.validation-plan.outputs.scope == 'full'
        shell: bash
        run: >-
          bash ./scripts/ci/Validate-HostedContainerImage.sh
          ${{ matrix.applicationRoot }}
          ${{ matrix.imageName }}
      # Cleanup is unconditional so no builder, cache, or archive survives the job, and
      # it fails the job when anything run-owned remains or anything else vanished.
      - name: Remove container validation state
        if: ${{ always() && needs.validation-plan.outputs.scope == 'full' }}
        shell: bash
        run: bash ./scripts/ci/Cleanup-HostedContainerImage.sh

  local-daemon-daemon-packaging:
    needs: validation-plan
    if: ${{ needs.validation-plan.outputs.scope == 'full' || needs.validation-plan.outputs.scope == 'guidance' }}
    name: Daemon packaging (local-daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish guidance-only required check
        if: needs.validation-plan.outputs.scope == 'guidance'
        run: echo 'Daemon packaging validation is not required for guidance-only changes.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.validation-plan.outputs.scope == 'full'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: needs.validation-plan.outputs.scope == 'full'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.validation-plan.outputs.scope == 'full'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows Service host source
        if: needs.validation-plan.outputs.scope == 'full'
        shell: pwsh
        working-directory: apps/Konclave.LocalDaemon
        run: |
          $arguments = @('check', '--bin', 'windows_service')
          if (Test-Path -LiteralPath 'src/bin/shared_service.rs') {
            $arguments += @('--bin', 'KonclaveLocalService')
          }
          & cargo @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows and shared-service host checks failed.'
          }
      - name: Validate daemon package definitions
        if: needs.validation-plan.outputs.scope == 'full'
        shell: pwsh
        working-directory: apps/Konclave.LocalDaemon
        run: |
          $sharedService = Test-Path -LiteralPath 'packaging/systemd/KonclaveLocalService.service'
          $unit = if ($sharedService) {
            'packaging/systemd/KonclaveLocalService.service'
          }
          else {
            'packaging/systemd/KonclaveLocalDaemon-daemon.service'
          }
          $unitLines = Get-Content -LiteralPath $unit
          $expectedLines = @('Type=simple', 'Restart=on-failure')
          if ($sharedService) {
            $expectedLines += 'WantedBy=default.target'
          }
          foreach ($expected in $expectedLines) {
            if ($expected -cnotin $unitLines) {
              throw "systemd unit is missing '$expected'."
            }
          }
          if (-not ($unitLines | Where-Object { $_ -clike 'ExecStart=*' })) {
            throw 'systemd unit is missing ExecStart.'
          }

          if ($sharedService) {
            if ($unitLines -contains 'DynamicUser=yes') {
              throw 'Per-user service must not use a dynamic system identity.'
            }
            bash -n packaging/systemd/manage-user-service.sh
            if ($LASTEXITCODE -ne 0) {
              throw 'systemd manager has invalid shell syntax.'
            }
          }

          $plistPath = if ($sharedService) {
            'packaging/launchd/com.genesis.KonclaveLocalService.plist'
          }
          else {
            'packaging/launchd/com.genesis.KonclaveLocalDaemon.plist'
          }
          [xml]$plist = Get-Content -LiteralPath $plistPath -Raw
          if ($plist.plist.version -ne '1.0' -or $null -eq $plist.plist.dict) {
            throw 'launchd property list is not a plist dictionary.'
          }
          if ($sharedService) {
            bash -n packaging/launchd/manage-agent.sh
            if ($LASTEXITCODE -ne 0) {
              throw 'launchd manager has invalid shell syntax.'
            }
          }

          $installer = 'packaging/windows/install-service.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $installer),
              [ref]$tokens,
              [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ($errors.Message -join [Environment]::NewLine)
          }

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }}
    permissions:
      actions: read
      contents: read
    needs:
      - source-policy
      - validation-plan
      - guidance-policy
      - rust-build-test
      - rust-lint
      - node-build-and-test
      - container-ci
      - local-daemon-daemon-packaging
      - dependabot-validation
    if: ${{ github.event.action != 'closed' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check validation results
        env:
          SOURCE_RESULT: ${{ needs.source-policy.result }}
          SCOPE: ${{ needs.validation-plan.outputs.scope }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          GUIDANCE_POLICY_RESULT: ${{ needs.guidance-policy.result }}
          RUST_BUILD_RESULT: ${{ needs.rust-build-test.result }}
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          NODE_RESULT: ${{ needs.node-build-and-test.result }}
          CONTAINER_RESULT: ${{ needs.container-ci.result }}
          DAEMON_PACKAGING_RESULT: ${{ needs.local-daemon-daemon-packaging.result }}
          DEPENDABOT_RESULT: ${{ needs.dependabot-validation.result }}
          IS_DEPENDABOT: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: |
          if [ "$SOURCE_RESULT" != "success" ]; then exit 1; fi
          if [ "$IS_DEPENDABOT" = "true" ]; then
            if [ "$DEPENDABOT_RESULT" != "success" ]; then exit 1; fi
            echo 'Dependabot validation passed without scheduling the full pull-request matrix.'
            exit 0
          fi
          if [ "$PLAN_RESULT" != "success" ]; then exit 1; fi
          if [ "$GUIDANCE_POLICY_RESULT" != "success" ]; then exit 1; fi
          for result in \
            "$RUST_BUILD_RESULT" \
            "$RUST_LINT_RESULT" \
            "$NODE_RESULT" \
            "$CONTAINER_RESULT" \
            "$DAEMON_PACKAGING_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
          if [ "$SCOPE" = "full" ] && [ "$RUST_BUILD_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$RUST_LINT_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$NODE_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$CONTAINER_RESULT" != "success" ]; then exit 1; fi
          if [ "$SCOPE" = "full" ] && [ "$DAEMON_PACKAGING_RESULT" != "success" ]; then exit 1; fi
          echo "Validation scope '$SCOPE' passed."
      - name: Checkout CI performance evidence
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/CiPerformance.Functions.ps1
            scripts/ci/Write-CiPerformanceEvidence.ps1
          sparse-checkout-cone-mode: false
      - name: Publish CI performance evidence
        id: performance-evidence
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/Write-CiPerformanceEvidence.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -RunId ([long]$env:GITHUB_RUN_ID) `
            -Attempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ci-performance')
      - name: Upload CI performance evidence
        if: ${{ always() && steps.performance-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-performance/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
