name: Local delivery diagnostics conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: local-delivery-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-delivery-diagnostics-conformance:
    name: Local delivery diagnostics conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve local diagnostics validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'local-delivery-diagnostics' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Preserve the scope checkout for its post-step cleanup.
          clean: false
      - name: Verify staged release container contract
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci/Test-A2AGatewayContainerContract.sh
          if bash ./scripts/ci/Test-A2AGatewayContainerContract.sh \
            'konclave-a2a-gateway:invalid-contract-version' >/dev/null 2>&1; then
            echo '::error::Gateway contract accepted an incorrect release image.'
            exit 1
          fi
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Verify pure diagnostic and bounded history decisions
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore -- --check
          cargo test --locked --package KonclaveDomainCore delivery_diagnostics::tests
          cargo test --locked --package KonclaveDomainCore message_history::tests
          cargo clippy --locked --package KonclaveDomainCore --all-targets -- -D warnings
      - name: Verify deterministic component relevance
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/ci/Test-ComponentValidationScope.ps1
      - name: Resolve pinned Node version
        if: steps.scope.outputs.run == 'true'
        id: toolchains
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - name: Install Node
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          npm-cache-scope: local-delivery-diagnostics-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Prepare client formatting evidence
        if: steps.scope.outputs.run == 'true'
        working-directory: extensions/Konclave.HostExtension
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format
          cargo fmt --manifest-path ../../Cargo.toml --package KonclaveLocalDaemon
          cargo fmt --manifest-path ../../Cargo.toml --package KonclaveLocalServiceTransport
          git diff
      - name: Verify deterministic client diagnostics
        if: steps.scope.outputs.run == 'true'
        working-directory: extensions/Konclave.HostExtension
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test:coverage
      - name: Verify authenticated persistence and service projections
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveLocalDaemon -- --check
          cargo fmt --package KonclaveLocalServiceTransport -- --check
          cargo test --locked --package KonclaveLocalServiceTransport --test authorization_handshake
          cargo test --locked --package KonclaveLocalDaemon --lib message_delivery
          cargo test --locked --package KonclaveLocalDaemon --lib message_history
          cargo test --locked --package KonclaveLocalDaemon --lib mcp::tests::regenerate_copilot_tool_contract_fixture -- --ignored --exact
          cargo test --locked --package KonclaveLocalDaemon --lib mcp::tests::copilot_tool_contract_fixture_matches_the_router -- --exact
          cargo test --locked --package KonclaveLocalDaemon --lib local_
          cargo clippy --locked --package KonclaveLocalDaemon --lib -- -D warnings
          cargo clippy --locked --package KonclaveLocalServiceTransport --all-targets -- -D warnings
      - name: Require unchanged submitted formatting and generated contracts
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: git diff --exit-code
      - name: Measure on-demand inspection overhead
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --package KonclaveLocalDaemon --lib \
            persistence::tests::message_delivery_inspection_performance_evidence \
            -- --ignored --exact --nocapture
