name: Local delivery diagnostics conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: local-delivery-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-delivery-diagnostics-conformance:
    name: Local delivery diagnostics conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve local diagnostics validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'local-delivery-diagnostics' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Preserve the scope checkout for its post-step cleanup.
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Verify body-free diagnostic decisions
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore -- --check
          cargo test --locked --package KonclaveDomainCore delivery_diagnostics::tests
          cargo clippy --locked --package KonclaveDomainCore --all-targets -- -D warnings
