name: Actions storage cleanup

on:
  workflow_run:
    workflows:
      - Agent plugin conformance
      - Package validation
      - Publish prerelease
    types:
      - completed
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  # Every run reconciles all eligible artifacts and caches, so the newest trigger
  # subsumes any older cleanup still queued or running.
  group: actions-storage-cleanup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize-storage-cleanup:
    name: Authorize storage cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require trusted manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Manual storage cleanup must run from the default branch.' >&2
            exit 1
          fi
          default_head="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )"
          if [ "$GITHUB_SHA" != "$default_head" ]; then
            echo 'Manual storage cleanup requires the current default-branch head.' >&2
            exit 1
          fi

  delete-run-artifacts:
    name: Delete transient artifacts
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event_name == 'workflow_run' &&
        (
          github.event.workflow_run.path == '.github/workflows/agent-plugin-conformance.yml' ||
          github.event.workflow_run.path == '.github/workflows/package-validation.yml' ||
          (
            github.event.workflow_run.path == '.github/workflows/publish-prerelease.yml' &&
            github.event.workflow_run.conclusion == 'success'
          )
        )
      )
    needs: authorize-storage-cleanup
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Delete transient artifacts from completed eligible runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          . ./scripts/ci/ActionsStoragePolicy.Functions.ps1

          function Get-RepositoryArtifacts {
            $items = @(
              gh api `
                --paginate `
                "repos/$env:REPOSITORY/actions/artifacts?per_page=100" `
                --jq '.artifacts[]' |
                  ConvertFrom-Json
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not list repository Actions artifacts.'
            }
            return $items
          }

          function Get-ArtifactWorkflowRuns {
            param(
              [Parameter(Mandatory)]
              [AllowEmptyCollection()]
              [object[]]$Artifacts
            )

            $runs = foreach ($runId in @(
              Get-ActionsArtifactWorkflowRunIds -Artifacts $Artifacts
            )) {
              $run = gh api `
                "repos/$env:REPOSITORY/actions/runs/$runId" |
                  ConvertFrom-Json -Depth 20
              if ($LASTEXITCODE -ne 0) {
                throw "Could not read Actions workflow run $runId."
              }
              $run
            }
            return @($runs)
          }

          $deleted = 0
          $alreadyAbsent = 0
          [long]$deletedBytes = 0
          for ($pass = 1; $pass -le 3; $pass++) {
            $artifacts = @(Get-RepositoryArtifacts)
            $runs = @(Get-ArtifactWorkflowRuns -Artifacts $artifacts)
            $selection = Select-ActionsArtifactDeletion `
              -Artifacts $artifacts `
              -Runs $runs
            if ($selection.deleteIds.Count -eq 0) {
              break
            }
            $sizesById = [Collections.Generic.Dictionary[long, long]]::new()
            foreach ($artifact in $artifacts) {
              $sizesById.Add(
                [long]$artifact.id,
                [long]$artifact.size_in_bytes
              )
            }
            foreach ($artifactId in $selection.deleteIds) {
              $output = gh api `
                --method DELETE `
                "repos/$env:REPOSITORY/actions/artifacts/$artifactId" 2>&1
              if ($LASTEXITCODE -ne 0) {
                $diagnostics = $output -join "`n"
                if ($diagnostics -notmatch '\bHTTP 404\b') {
                  throw "Could not delete Actions artifact $artifactId.`n$diagnostics"
                }
                # The local demo may win this exact-artifact deletion race.
                Write-Output "::notice::Artifact $artifactId was already deleted."
                $alreadyAbsent++
                continue
              }
              $deleted++
              $deletedBytes += $sizesById[[long]$artifactId]
            }
          }

          $remainingArtifacts = @(Get-RepositoryArtifacts)
          $remainingRuns = @(
            Get-ArtifactWorkflowRuns -Artifacts $remainingArtifacts
          )
          $remainingSelection = Select-ActionsArtifactDeletion `
            -Artifacts $remainingArtifacts `
            -Runs $remainingRuns
          if ($remainingSelection.deleteIds.Count -ne 0) {
            throw (
              "Repository still retains " +
              "$($remainingSelection.deleteIds.Count) eligible artifact(s)."
            )
          }
          (
            "Deleted $deleted transient artifact(s), totaling $deletedBytes bytes; " +
            "$alreadyAbsent were already absent."
          )

  prune-actions-caches:
    name: Bound Actions caches
    needs: authorize-storage-cleanup
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Remove pull-request caches and enforce five-GiB budget
        shell: pwsh
        env:
          CACHE_BUDGET_BYTES: '5368709120'
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $caches = @(
            gh api `
              --paginate `
              "repos/$env:REPOSITORY/actions/caches?per_page=100" `
              --jq '.actions_caches[]' |
                ConvertFrom-Json
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list repository Actions caches.'
          }
          [long]$budget = $env:CACHE_BUDGET_BYTES
          . ./scripts/ci/ActionsStoragePolicy.Functions.ps1
          $selection = Select-ActionsCacheDeletion `
            -Caches $caches `
            -BudgetBytes $budget
          foreach ($cacheId in $selection.deleteIds) {
            gh api `
              --method DELETE `
              "repos/$env:REPOSITORY/actions/caches/$cacheId"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not delete Actions cache $cacheId."
            }
          }
          $remaining = @(
            gh api `
              --paginate `
              "repos/$env:REPOSITORY/actions/caches?per_page=100" `
              --jq '.actions_caches[]' |
                ConvertFrom-Json
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify repository Actions caches.'
          }
          [long]$remainingBytes = 0
          foreach ($cache in $remaining) {
            $remainingBytes += [long]$cache.size_in_bytes
            if ([string]$cache.ref -ne 'refs/heads/main') {
              throw "Pull-request cache remained after cleanup: $($cache.id)"
            }
          }
          if ($remainingBytes -gt $budget) {
            throw "Actions caches remain above the five-GiB budget: $remainingBytes bytes."
          }
          "Actions caches are bounded at $remainingBytes bytes."
