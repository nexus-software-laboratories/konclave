name: Profile lifecycle conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: profile-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-lifecycle-conformance:
    name: Profile lifecycle conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve profile lifecycle validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'profile-lifecycle' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Verify retained failures and terminal-state observation
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo fmt --package KonclaveLocalDaemon -- --check; then
            cargo fmt --package KonclaveLocalDaemon
            git diff -- apps/Konclave.LocalDaemon
            exit 1
          fi
          cargo fmt --package KonclaveLocalServiceTransport -- --check
          cargo test --locked --package KonclaveLocalDaemon --lib profile_lifecycle::tests
          cargo test --locked --package KonclaveLocalDaemon --lib profile_runtime::tests
          cargo test --locked --package KonclaveLocalDaemon --lib profile_supervisor::tests
          cargo test --locked --package KonclaveLocalDaemon --lib local_failure_diagnostics::tests
          cargo test --locked --package KonclaveLocalDaemon --lib local_service::tests
          cargo test --locked --package KonclaveLocalServiceTransport request_interruption::tests
          cargo clippy --locked --package KonclaveLocalDaemon --lib --tests -- -D warnings
          cargo clippy --locked --package KonclaveLocalServiceTransport --lib -- -D warnings
