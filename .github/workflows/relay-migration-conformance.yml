name: Relay migration conformance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: relay-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay-migration-conformance:
    name: Relay migration conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve relay migration validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for relay migration conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/genesis-delivery\.json$' -or
                $_ -match '^\.github/workflows/relay-migration-conformance\.yml$' -or
                $_ -match '^apps/Konclave\.CommandLine/(?:Cargo\.toml|src/installation\.rs)$' -or
                $_ -match '^apps/Konclave\.LocalDaemon/(?:Cargo\.toml|src/(?:bin/relay_migration|enrollment_persistence|lib|persistence|relay_migration|runtime)\.rs|src/persistence/relay_migration\.rs)$' -or
                $_ -match '^crates/Konclave\.ClientLibrary/' -or
                $_ -match '^scripts/installation/' -or
                $_ -match '^scripts/packaging/' -or
                $_ -match '^distribution/'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: relay-migration-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify relay migration policy
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --package KonclaveClientLibrary \
            --package KonclaveCommandLine \
            --package KonclaveLocalDaemon \
            -- \
            --check
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            relay_enrollment_installation
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            relay_migration::tests
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            persistence::relay_migration::tests
          cargo test \
            --locked \
            --package KonclaveCommandLine \
            native_installation_identity
          cargo clippy \
            --locked \
            --package KonclaveClientLibrary \
            --all-targets \
            -- \
            -D warnings
          cargo clippy \
            --locked \
            --package KonclaveCommandLine \
            --all-targets \
            -- \
            -D warnings
          cargo clippy \
            --locked \
            --package KonclaveLocalDaemon \
            --all-targets \
            -- \
            -D warnings
          pwsh ./scripts/installation/Test-InstallationRuntime.ps1
