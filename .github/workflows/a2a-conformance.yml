name: A2A conformance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: a2a-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a2a-conformance:
    name: A2A conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve A2A validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          elseif ('${{ github.event.pull_request.draft }}' -eq 'true') {
            $run = $false
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for A2A conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
                $files | Where-Object {
                  $_ -match '^Cargo\.(lock|toml)$' -or
                  $_ -match '^\.github/workflows/a2a-conformance\.yml$' -or
                  $_ -match '^apps/Konclave\.A2AGateway/' -or
                  $_ -match '^apps/Konclave\.LocalDaemon/tests/packaged_distribution_e2e\.rs$' -or
                  $_ -match '^conformance/a2a/' -or
                  $_ -match '^crates/Konclave\.A2A' -or
                  $_ -match '^protocol/releases/' -or
                  $_ -match '^scripts/a2a/(?:Invoke-A2A.*\.ps1|Test-A2ATckProfile\.ps1)$' -or
                  $_ -match '^scripts/protocol/Test-ProtocolRelease\.ps1$' -or
                  $_ -match '^third_party/a2a/'
                }
              ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify protocol release manifests
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/protocol/Test-ProtocolRelease.ps1
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify standalone A2A gateway
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveA2AGatewayHost -- --check
          cargo fmt --package KonclaveLocalDaemon -- --check
          cargo test --locked --package KonclaveA2AGatewayHost
          cargo clippy --locked --package KonclaveA2AGatewayHost --all-targets -- -D warnings
          cargo clippy \
            --locked \
            --package KonclaveLocalDaemon \
            --test packaged_distribution_e2e \
            -- \
            -D warnings
      - name: Install pinned uv
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          printf '%s\n' \
            'uv==0.11.7 --hash=sha256:4e4d5e31bea86e1b6e0f5a0f95e14e80018e6f6c0129256d2915a4b3d793644d' \
            > '${{ runner.temp }}/uv-requirements.txt'
          python3 -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --quiet \
            --require-hashes \
            --requirement '${{ runner.temp }}/uv-requirements.txt'
      - name: Run pinned A2A conformance profile
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: >-
          ./scripts/a2a/Invoke-A2ATck.ps1
          -OutputDirectory '${{ runner.temp }}/a2a-tck'
      - name: Verify a2a-python interoperability
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: >-
          ./scripts/a2a/Invoke-A2APythonInterop.ps1
          -OutputDirectory '${{ runner.temp }}/a2a-python'
