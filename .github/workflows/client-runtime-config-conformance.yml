name: Client runtime config conformance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: client-runtime-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client-runtime-config-conformance:
    name: Client runtime config conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve client-runtime-config validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for client-runtime-config conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/genesis-delivery\.json$' -or
                $_ -match '^\.github/workflows/client-runtime-config-conformance\.yml$' -or
                $_ -match '^apps/Konclave\.CommandLine/' -or
                $_ -match '^crates/Konclave\.LocalServiceTransport/' -or
                $_ -match '^docs/(?:adr/adr-0008-shared-local-service|distribution/installation|integrations/generic-client)\.md$' -or
                $_ -match '^extensions/Konclave\.HostExtension/' -or
                $_ -match '^scripts/demo/(?:Invoke-KonclaveCopilotSmoke|Start-KonclaveLocalDemo)\.ps1$' -or
                $_ -match '^tools/Konclave\.CopilotSmoke/'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: client-runtime-config-conformance
          cache-on-failure: false
      - name: Resolve pinned Node version
        if: steps.scope.outputs.run == 'true'
        id: toolchains
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - name: Install Node
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          npm-cache-scope: client-runtime-config-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Verify transport configuration boundary
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveLocalServiceTransport -- --check
          cargo test --locked --package KonclaveLocalServiceTransport
          cargo fmt --package KonclaveCommandLine -- --check
          cargo test \
            --locked \
            --package KonclaveCommandLine \
            local_service_installation
          cargo test \
            --locked \
            --package KonclaveCommandLine \
            doctor
          cargo test \
            --locked \
            --package KonclaveCommandLine \
            --test cli \
            external_init_is_idempotent_and_conflicts_fail \
            -- \
            --exact
          cargo check \
            --locked \
            --package KonclaveCommandLine \
            --test cli
          cargo check \
            --locked \
            --package KonclaveCommandLine \
            --test authorization
          cargo check \
            --locked \
            --package KonclaveLocalDaemon \
            --test packaged_distribution_e2e
          cargo clippy \
            --locked \
            --package KonclaveLocalServiceTransport \
            --all-targets \
            -- \
            -D warnings
          cargo clippy \
            --locked \
            --package KonclaveCommandLine \
            --all-targets \
            -- \
            -D warnings
      - name: Verify installed client configuration
        if: steps.scope.outputs.run == 'true'
        working-directory: extensions/Konclave.HostExtension
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm exec -- vitest run tests/service-config.test.ts
      - name: Verify distribution script syntax
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/demo/Invoke-KonclaveCopilotSmoke.ps1',
            'scripts/demo/Start-KonclaveLocalDemo.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "$path contains PowerShell parse errors."
            }
          }
          bash -n scripts/packaging/Test-PackagedAcceptance.sh
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged acceptance script syntax validation failed.'
          }
