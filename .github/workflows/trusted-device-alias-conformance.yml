name: Trusted device alias conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-device-alias-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-device-alias-conformance:
    name: Trusted device alias conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve trusted device alias validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for trusted device alias conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/genesis-(?:delivery|guidance)\.json$' -or
                $_ -match '^\.github/workflows/trusted-device-alias-conformance\.yml$' -or
                $_ -match '^docs/README\.md$' -or
                $_ -match '^docs/architecture/decisions\.md$' -or
                $_ -match '^docs/adr/adr-0025-trusted-device-alias-bootstrap\.md$' -or
                $_ -match '^crates/Konclave\.DomainCore/(?:Cargo\.toml|src/(?:error|lib|trusted_devices)\.rs)$'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: trusted-device-alias-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify trusted device alias foundation
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore -- --check
          cargo test --locked --package KonclaveDomainCore trusted_device
          cargo clippy \
            --locked \
            --package KonclaveDomainCore \
            --all-targets \
            -- \
            -D warnings
          pwsh -NoProfile -Command \
            "Get-Content -Raw .github/genesis-guidance.json | ConvertFrom-Json | Out-Null"
