name: Response continuation conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: response-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  response-continuation-conformance:
    name: Response continuation conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve response continuation validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'response-continuation' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Verify pure response continuation foundation
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore
          git diff
          cargo test --locked --package KonclaveDomainCore response_continuation::tests
          cargo clippy --locked --package KonclaveDomainCore --all-targets -- -D warnings
          git diff --exit-code
      - name: Verify deterministic component relevance
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/ci/Test-ComponentValidationScope.ps1
      - name: Resolve pinned Node version
        if: steps.scope.outputs.run == 'true'
        id: toolchains
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - name: Install Node
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          npm-cache-scope: response-continuation-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Prepare submitted formatting evidence
        if: steps.scope.outputs.run == 'true'
        id: format
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix extensions/Konclave.HostExtension
          npm run format --prefix extensions/Konclave.HostExtension
          cargo fmt --package KonclaveLocalDaemon
          git diff --binary --output="$RUNNER_TEMP/response-continuation-format.patch"
      - name: Retain submitted formatting evidence
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: response-continuation-format
          path: ${{ runner.temp }}/response-continuation-format.patch
          if-no-files-found: error
          retention-days: 1
      - name: Verify continuation hooks and idle delivery
        if: steps.scope.outputs.run == 'true'
        working-directory: extensions/Konclave.HostExtension
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test:unit -- tests/adapter-delivery.test.ts tests/policy-enforcement.test.ts tests/delivery-runtime.test.ts tests/extension-runtime.test.ts
      - name: Verify durable continuation and current policy admission
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package KonclaveLocalDaemon --lib response_continuation
          cargo test --locked --package KonclaveLocalDaemon --lib directed_request
          cargo test --locked --package KonclaveLocalDaemon --lib local_service::tests
          cargo clippy --locked --package KonclaveLocalDaemon --all-targets -- -D warnings
          git diff --exit-code
