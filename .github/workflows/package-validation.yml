name: Package validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/package-validation.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'apps/Konclave.CommandLine/**'
      - 'apps/Konclave.CommunityRelay/**'
      - 'apps/Konclave.LocalDaemon/**'
      - 'crates/**'
      - 'distribution/**'
      - 'docs/distribution/**'
      - 'extensions/Konclave.HostExtension/**'
      - 'scripts/CargoLock.Functions.ps1'
      - 'scripts/ci/**'
      - 'scripts/packaging/**'
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation identifier
        required: false
        type: string
      demo_windows_only:
        description: Build only the transient Windows package for the local demo
        required: false
        default: false
        type: boolean

run-name: >-
  ${{ inputs.request_id && format('Package validation [{0}]', inputs.request_id) ||
      github.event.pull_request.title || 'Package validation' }}

permissions:
  contents: read

concurrency:
  # Each dispatch is consumed and cancelled independently by its caller.
  group: package-validation-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-native:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.demo_windows_only && '[{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve pinned release toolchains
        id: release-toolchains
        shell: pwsh
        run: |
          $releaseJson = Get-Content distribution/release-artifacts.json -Raw
          if (
            -not (
              $releaseJson |
                Test-Json -SchemaFile distribution/release-artifacts.schema.json
            )
          ) {
            throw 'Release artifact manifest does not satisfy its schema.'
          }
          $release = $releaseJson | ConvertFrom-Json -Depth 100
          "rust=$($release.release.toolchains.rust)" >>$env:GITHUB_OUTPUT
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.release-toolchains.outputs.rust }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-${{ matrix.target }}
          cache-on-failure: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.release-toolchains.outputs.node }}
          npm-cache-scope: package-${{ matrix.target }}
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Build native release binaries
        shell: pwsh
        run: |
          cargo build `
            --locked `
            --release `
            --target '${{ matrix.target }}' `
            -p KonclaveCommandLine `
            -p KonclaveLocalDaemon `
            -p KonclaveCommunityRelay `
            --bins
          if ($LASTEXITCODE -ne 0) {
            throw 'Native release build failed.'
          }
      - name: Exercise Windows local security boundaries
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' && !inputs.demo_windows_only }}
        shell: pwsh
        run: |
          cargo test `
            --locked `
            --release `
            --target '${{ matrix.target }}' `
            -p KonclaveWindowsSecurity
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows account and DACL tests failed.'
          }
          cargo test `
            --locked `
            --release `
            --target '${{ matrix.target }}' `
            -p KonclaveLocalServiceTransport `
            --test windows_endpoint
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows local-service endpoint tests failed.'
          }
      - name: Build and verify Copilot plugin
        shell: pwsh
        working-directory: extensions/Konclave.HostExtension
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed.' }
          npm exec -- vitest run tests/thin-client.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Plugin thin-client contract tests failed.' }
      - name: Package and exercise extracted artifacts
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          $pluginArchive = Join-Path `
            'extensions' `
            'Konclave.HostExtension' `
            'build' `
            'outputs' `
            "konclave-$($release.release.version).zip"
          ./scripts/packaging/Test-ReleasePackaging.ps1 `
            -Target '${{ matrix.target }}' `
            -BinaryDirectory "target/${{ matrix.target }}/release" `
            -PluginArchivePath $pluginArchive `
            -OutputDirectory 'target/release-artifacts' `
            -RunBinaries
      - name: Emit native artifact provenance
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          $artifacts = @(
            $release.artifacts |
              Where-Object {
                $_.target -ceq '${{ matrix.target }}' -and
                $_.kind -in @('client', 'relay')
              }
          )
          if ($artifacts.Count -ne 2) {
            throw 'Native target must resolve to client and relay artifacts.'
          }
          foreach ($artifact in $artifacts) {
            $archive = Join-Path 'target/release-artifacts' $artifact.fileName
            ./scripts/packaging/New-ReleaseProvenance.ps1 `
              -ArtifactPath $archive `
              -ArtifactId $artifact.id `
              -Target $artifact.target `
              -BuildKind native `
              -OutputPath "$archive.intoto.jsonl"
          }
      - name: Upload unsigned package candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konclave-${{ matrix.target }}-unsigned
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Keep demo candidate available for its caller
        if: ${{ inputs.demo_windows_only }}
        shell: pwsh
        run: Start-Sleep -Seconds 600

  package-container:
    name: Package linux/amd64 container
    if: ${{ !inputs.demo_windows_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve container release contract
        id: container-contract
        shell: pwsh
        run: |
          $releaseJson = Get-Content distribution/release-artifacts.json -Raw
          if (
            -not (
              $releaseJson |
                Test-Json -SchemaFile distribution/release-artifacts.schema.json
            )
          ) {
            throw 'Release artifact manifest does not satisfy its schema.'
          }
          $release = $releaseJson | ConvertFrom-Json -Depth 100
          $artifacts = @($release.artifacts | Where-Object { $_.kind -ceq 'container' })
          if ($artifacts.Count -ne 1) {
            throw 'Release manifest must contain exactly one container artifact.'
          }
          "CONTAINER_RELEASE_FILE=$($artifacts[0].fileName)" >>$env:GITHUB_ENV
          "CONTAINER_RELEASE_IMAGE=$($artifacts[0].image)" >>$env:GITHUB_ENV
          "artifact-id=$($artifacts[0].id)" >>$env:GITHUB_OUTPUT
          "syft=$($release.release.toolchains.syft)" >>$env:GITHUB_OUTPUT
          "syft-sha256=$($release.release.toolchains.syftLinuxAmd64Sha256)" >>$env:GITHUB_OUTPUT
      - name: Verify Compose and container contracts
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci/Test-ContainerImageContract.sh
          compose_image="$(
            KONCLAVE_RELAY_ACCESS_SOURCE=/dev/null \
              docker compose \
              --file apps/Konclave.CommunityRelay/compose.example.yaml \
              config --images
          )"
          if [ "$compose_image" != "$CONTAINER_RELEASE_IMAGE" ]; then
            echo '::error::Compose image does not match the release manifest.'
            exit 1
          fi
          bash ./scripts/ci/Initialize-JobPrivatePaths.sh \
            CONTAINER_VALIDATION_ROOT=konclave-container-validation
      - name: Verify container validation cleanup contract
        shell: bash
        run: bash ./scripts/ci/Test-ContainerValidationCleanup.sh
      - name: Capture Docker baseline
        shell: bash
        run: bash ./scripts/ci/Capture-ContainerValidationBaseline.sh
      - name: Build validated OCI and Docker archives
        shell: bash
        run: >-
          bash ./scripts/ci/Validate-HostedContainerImage.sh
          apps/Konclave.CommunityRelay
          konclave-community-relay
          "$CONTAINER_RELEASE_IMAGE"
      - name: Stage Docker-loadable release archive
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 target/release-container
          cp \
            "$CONTAINER_VALIDATION_ROOT/konclave-community-relay-amd64-docker.tar" \
            "target/release-container/$CONTAINER_RELEASE_FILE"
          cp distribution/release-artifacts.json target/release-container/RELEASE.json
          cp distribution/UNSIGNED-PRERELEASE.txt target/release-container/
      - name: Download pinned Syft
        id: syft
        shell: bash
        env:
          SYFT_VERSION: ${{ steps.container-contract.outputs.syft }}
          SYFT_SHA256: ${{ steps.container-contract.outputs.syft-sha256 }}
        run: |
          set -euo pipefail
          syft_root="$RUNNER_TEMP/syft-$SYFT_VERSION"
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install -d -m 0700 "$syft_root"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$syft_root" syft
          chmod 0700 "$syft_root/syft"
          actual_version="$("$syft_root/syft" version -o json | jq -er '.version')"
          if [ "$actual_version" != "$SYFT_VERSION" ]; then
            echo '::error::Downloaded Syft version does not match the release contract.'
            exit 1
          fi
          printf 'cmd=%s\n' "$syft_root/syft" >>"$GITHUB_OUTPUT"
      - name: Emit container SBOM and provenance
        shell: pwsh
        run: |
          $archive = Join-Path 'target/release-container' $env:CONTAINER_RELEASE_FILE
          $rawSbom = "$archive.raw.cdx.json"
          & '${{ steps.syft.outputs.cmd }}' scan "docker-archive:$archive" `
            -o "cyclonedx-json=$rawSbom"
          if ($LASTEXITCODE -ne 0) { throw 'Container SBOM scan failed.' }
          ./scripts/packaging/Normalize-CycloneDx.ps1 `
            -InputPath $rawSbom `
            -OutputPath "$archive.cdx.json" `
            -ComponentName 'konclave-community-relay-container' `
            -ComponentVersion (
              (Get-Content distribution/release-artifacts.json -Raw |
                ConvertFrom-Json -Depth 100).release.version
            ) `
            -ComponentType container
          Remove-Item -LiteralPath $rawSbom -Force
          ./scripts/packaging/New-ReleaseProvenance.ps1 `
            -ArtifactPath $archive `
            -ArtifactId '${{ steps.container-contract.outputs.artifact-id }}' `
            -Target 'linux/amd64' `
            -BuildKind container `
            -OutputPath "$archive.intoto.jsonl" `
            -SyftCommand '${{ steps.syft.outputs.cmd }}'
      - name: Remove container validation state
        if: always()
        shell: bash
        run: bash ./scripts/ci/Cleanup-HostedContainerImage.sh
      - name: Upload unsigned container candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konclave-linux-amd64-container-unsigned
          path: target/release-container/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release-integrity:
    name: Release integrity
    if: ${{ !inputs.demo_windows_only }}
    needs:
      - package-native
      - package-container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve pinned release toolchains
        id: release-toolchains
        shell: pwsh
        run: |
          $releaseJson = Get-Content distribution/release-artifacts.json -Raw
          if (
            -not (
              $releaseJson |
                Test-Json -SchemaFile distribution/release-artifacts.schema.json
            )
          ) {
            throw 'Release artifact manifest does not satisfy its schema.'
          }
          $release = $releaseJson | ConvertFrom-Json -Depth 100
          "rust=$($release.release.toolchains.rust)" >>$env:GITHUB_OUTPUT
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.release-toolchains.outputs.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-integrity
          cache-on-failure: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.release-toolchains.outputs.node }}
          npm-cache-scope: release-integrity
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Download native and container candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: konclave-*-unsigned
          path: target/release-set
          merge-multiple: true
      - name: Verify downloaded candidate set
        shell: pwsh
        run: |
          $releaseRoot = 'target/release-set'
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          $expected = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal
          )
          foreach ($name in @('RELEASE.json', 'UNSIGNED-PRERELEASE.txt')) {
            [void]$expected.Add($name)
          }
          foreach ($artifact in $release.artifacts) {
            [void]$expected.Add([string]$artifact.fileName)
            [void]$expected.Add("$($artifact.fileName).intoto.jsonl")
            if ($artifact.kind -ceq 'container') {
              [void]$expected.Add("$($artifact.fileName).cdx.json")
            }
          }
          $actual = [string[]]@(
            Get-ChildItem -LiteralPath $releaseRoot -File |
              ForEach-Object Name
          )
          $expectedNames = [string[]]@($expected)
          [Array]::Sort($actual, [StringComparer]::Ordinal)
          [Array]::Sort($expectedNames, [StringComparer]::Ordinal)
          if (@(Compare-Object $actual $expectedNames -CaseSensitive).Count -gt 0) {
            throw 'Downloaded candidate set is incomplete or contains an unknown file.'
          }
      - name: Generate native and plugin SBOMs
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          $version = [string]$release.release.version
          foreach ($artifact in @($release.artifacts | Where-Object { $_.kind -in @('client', 'relay') })) {
            $roots = if ($artifact.kind -ceq 'client') {
              @('KonclaveCommandLine', 'KonclaveLocalDaemon')
            } else {
              @('KonclaveCommunityRelay')
            }
            ./scripts/packaging/New-ReleaseRustSbom.ps1 `
              -Target $artifact.target `
              -ArtifactId $artifact.id `
              -ArtifactName $artifact.id `
              -ArtifactVersion $version `
              -RootPackageName $roots `
              -OutputPath (
                Join-Path 'target/release-set' "$($artifact.fileName).rust.cdx.json"
              )
          }

          Push-Location extensions/Konclave.HostExtension
          try {
            $rawPluginSbom = Join-Path $env:RUNNER_TEMP 'konclave-plugin.raw.cdx.json'
            $output = npm sbom `
              --sbom-format cyclonedx `
              --sbom-type application `
              --package-lock-only `
              --omit dev
            if ($LASTEXITCODE -ne 0) { throw 'npm SBOM generation failed.' }
            [IO.File]::WriteAllLines(
              $rawPluginSbom,
              [string[]]$output,
              [Text.UTF8Encoding]::new($false)
            )
          }
          finally {
            Pop-Location
          }
          ./scripts/packaging/Normalize-CycloneDx.ps1 `
            -InputPath $rawPluginSbom `
            -OutputPath (
              Join-Path 'target/release-set' "konclave-copilot-plugin-$version.cdx.json"
            ) `
            -ComponentName 'konclave-copilot-plugin' `
            -ComponentVersion $version
          Remove-Item -LiteralPath $rawPluginSbom -Force
      - name: Assemble and verify complete release set
        shell: pwsh
        run: |
          $releaseRoot = 'target/release-set'
          Copy-Item distribution/release-artifacts.json `
            (Join-Path $releaseRoot 'RELEASE.json') -Force
          Copy-Item distribution/release-artifacts.schema.json $releaseRoot
          Copy-Item distribution/UNSIGNED-PRERELEASE.txt $releaseRoot -Force
          Copy-Item scripts/packaging/ReleaseIntegrity.Functions.ps1 $releaseRoot
          Copy-Item scripts/packaging/Verify-Release.ps1 $releaseRoot

          ./scripts/packaging/Test-ReleaseIntegrity.ps1
          ./scripts/packaging/Test-ReleaseMetadata.ps1
          ./scripts/packaging/Test-ReleaseRustSbom.ps1
          . ./scripts/packaging/ReleaseIntegrity.Functions.ps1
          [void](Test-ReleaseContractCoverage -Directory $releaseRoot)
          ./scripts/packaging/Test-PublicReleaseMetadata.ps1 -Directory $releaseRoot
          ./scripts/packaging/New-ReleaseChecksums.ps1 -Directory $releaseRoot
          & (Join-Path $releaseRoot 'Verify-Release.ps1') -Directory $releaseRoot
  packaged-acceptance:
    name: Packaged clean-install acceptance
    if: ${{ !inputs.demo_windows_only }}
    needs:
      - package-native
      - package-container
      - release-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve pinned release toolchains
        id: release-toolchains
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw |
            ConvertFrom-Json -Depth 100
          "rust=$($release.release.toolchains.rust)" >>$env:GITHUB_OUTPUT
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.release-toolchains.outputs.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: packaged-acceptance
          cache-on-failure: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.release-toolchains.outputs.node }}
          npm-cache-scope: packaged-acceptance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json') }}
      - name: Download Linux native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: konclave-x86_64-unknown-linux-gnu-unsigned
          path: target/packaged-acceptance
      - name: Download Linux container candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: konclave-linux-amd64-container-unsigned
          path: target/packaged-acceptance
      - name: Exercise clean native and container installations
        shell: bash
        run: |
          set -euo pipefail
          release='distribution/release-artifacts.json'
          client="$(
            jq -er '.artifacts[] | select(.id == "konclave-client-linux-x64") | .fileName' "$release"
          )"
          relay="$(
            jq -er '.artifacts[] | select(.id == "konclave-relay-linux-x64") | .fileName' "$release"
          )"
          container="$(
            jq -er \
              '.artifacts[] | select(.id == "konclave-community-relay-container-linux-amd64") | .fileName' \
              "$release"
          )"
          image="$(
            jq -er \
              '.artifacts[] | select(.id == "konclave-community-relay-container-linux-amd64") | .image' \
              "$release"
          )"
          bash ./scripts/packaging/Test-PackagedAcceptance.sh \
            "target/packaged-acceptance/$client" \
            "target/packaged-acceptance/$relay" \
            "target/packaged-acceptance/$container" \
            "$image"

  package-validation:
    name: Package validation
    if: always()
    needs:
      - package-native
      - package-container
      - release-integrity
      - packaged-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check package matrix
        shell: bash
        env:
          DEMO_WINDOWS_ONLY: ${{ inputs.demo_windows_only }}
          NATIVE_RESULT: ${{ needs.package-native.result }}
          CONTAINER_RESULT: ${{ needs.package-container.result }}
          INTEGRITY_RESULT: ${{ needs.release-integrity.result }}
          ACCEPTANCE_RESULT: ${{ needs.packaged-acceptance.result }}
        run: |
          set -eu
          if [ "$NATIVE_RESULT" != 'success' ]; then
            echo "::error::Native package matrix concluded with $NATIVE_RESULT."
            exit 1
          fi
          if [ "$DEMO_WINDOWS_ONLY" = 'true' ]; then
            echo 'Transient Windows demo package passed.'
            exit 0
          fi
          if [ "$CONTAINER_RESULT" != 'success' ]; then
            echo "::error::Container packaging concluded with $CONTAINER_RESULT."
            exit 1
          fi
          if [ "$INTEGRITY_RESULT" != 'success' ]; then
            echo "::error::Release integrity concluded with $INTEGRITY_RESULT."
            exit 1
          fi
          if [ "$ACCEPTANCE_RESULT" != 'success' ]; then
            echo "::error::Packaged acceptance concluded with $ACCEPTANCE_RESULT."
            exit 1
          fi
          echo 'Native, container, integrity, and packaged acceptance passed.'
