name: Request-service conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: request-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  request-service-conformance:
    name: Request-service conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve request-service scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'request-service' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: request-service-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify channel authorization and terminal reply decisions
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore --package KonclaveProtocolContracts --package KonclaveCryptographicCore --package KonclaveLocalDaemon -- --check
          cargo test --locked --package KonclaveDomainCore request_service::
          cargo test --locked --package KonclaveProtocolContracts --package KonclaveCryptographicCore request_service
          cargo test --locked --package KonclaveLocalDaemon request_service
          cargo test --locked --package KonclaveLocalDaemon directed_request_response_reservation_is_atomic
          cargo clippy --locked --package KonclaveDomainCore --package KonclaveProtocolContracts --package KonclaveCryptographicCore --package KonclaveLocalDaemon --all-targets -- -D warnings
      - name: Generate native tool contract
        id: tool-contract
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package KonclaveLocalDaemon --lib regenerate_copilot_tool_contract_fixture -- --ignored
          cargo test --locked --package KonclaveLocalDaemon copilot_tool_contract_fixture_matches_the_router
      - name: Retain exact native tool contract
        if: steps.scope.outputs.run == 'true' && steps.tool-contract.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: request-service-tool-contract
          path: fixtures/local-service/v1/copilot-tools.json
          if-no-files-found: error
          retention-days: 1
      - name: Require unchanged submitted tool contract
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: git diff --exit-code -- fixtures/local-service/v1/copilot-tools.json
      - name: Resolve protocol Node version
        id: protocol-toolchain
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $release = Get-Content distribution/release-artifacts.json -Raw | ConvertFrom-Json -Depth 100
          "node=$($release.release.toolchains.node)" >>$env:GITHUB_OUTPUT
      - name: Install protocol Node toolchain
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.protocol-toolchain.outputs.node }}
          npm-cache-scope: request-service-protocol
          npm-cache-dependency-hash: ${{ hashFiles('packages/Konclave.ProtocolContracts.TypeScript/package-lock.json') }}
      - name: Generate and verify TypeScript protocol projection
        id: protocol-generation
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/Konclave.ProtocolContracts.TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run generate
          npm run build
          npm test
      - name: Retain exact TypeScript protocol projection
        if: steps.scope.outputs.run == 'true' && steps.protocol-generation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: request-service-protocol-contract
          path: packages/Konclave.ProtocolContracts.TypeScript/src/generated
          if-no-files-found: error
          retention-days: 1
      - name: Require unchanged submitted TypeScript protocol projection
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: git diff --exit-code -- packages/Konclave.ProtocolContracts.TypeScript/src/generated
      - name: Verify component relevance
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/ci/Test-ComponentValidationScope.ps1
