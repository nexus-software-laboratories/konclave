name: Request-service conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: request-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  request-service-conformance:
    name: Request-service conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve request-service scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'request-service' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: request-service-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify channel authorization and terminal reply decisions
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package KonclaveDomainCore --package KonclaveProtocolContracts --package KonclaveCryptographicCore --package KonclaveLocalDaemon -- --check
          cargo test --locked --package KonclaveDomainCore request_service::
          cargo test --locked --package KonclaveProtocolContracts --package KonclaveCryptographicCore request_service
          cargo test --locked --package KonclaveLocalDaemon request_service
          cargo test --locked --package KonclaveLocalDaemon copilot_tool_contract_fixture_matches_the_router
          cargo test --locked --package KonclaveLocalDaemon directed_request_response_reservation_is_atomic
          cargo clippy --locked --package KonclaveDomainCore --package KonclaveProtocolContracts --package KonclaveCryptographicCore --package KonclaveLocalDaemon --all-targets -- -D warnings
      - name: Verify component relevance
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/ci/Test-ComponentValidationScope.ps1
