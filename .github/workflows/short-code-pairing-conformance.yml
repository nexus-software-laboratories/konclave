name: Short-code pairing conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: short-code-pairing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  short-code-pairing-conformance:
    name: Short-code pairing conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve short-code pairing validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $run = $true
          }
          else {
            $files = @(
              gh api --paginate `
                "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER/files?per_page=100" `
                --jq '.[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve pull-request files for short-code pairing conformance.'
            }
            if ($files.Count -eq 0) {
              throw 'Pull-request file discovery returned no files.'
            }
            $run = $files.Count -ge 3000 -or @(
              $files | Where-Object {
                $_ -match '^Cargo\.(lock|toml)$' -or
                $_ -match '^\.github/genesis-delivery\.json$' -or
                $_ -match '^\.github/workflows/short-code-pairing-conformance\.yml$' -or
                $_ -match '^docs/adr/adr-0024-opaque-short-code-mutual-verification\.md$' -or
                $_ -match '^docs/development/conformance\.md$' -or
                $_ -match '^scripts/ci/Validate-RustSecurityDependencies\.sh$' -or
                $_ -match '^crates/Konclave\.DomainCore/(?:Cargo\.toml|src/(?:error|identifiers|lib|short_code_pairing)\.rs)$' -or
                $_ -match '^crates/Konclave\.CryptographicCore/(?:Cargo\.toml|src/(?:error|lib|short_code_pairing)\.rs)$' -or
                $_ -match '^crates/Konclave\.SecretStorage/(?:Cargo\.toml|src/authenticated_cipher\.rs)$'
              }
            ).Count -ne 0
          }
          "run=$($run.ToString().ToLowerInvariant())" >>$env:GITHUB_OUTPUT
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: short-code-pairing-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify short-code pairing foundation
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --package KonclaveDomainCore \
            --package KonclaveCryptographicCore \
            -- \
            --check
          cargo test \
            --locked \
            --package KonclaveDomainCore \
            short_code_pairing
          cargo test \
            --locked \
            --package KonclaveCryptographicCore \
            short_code_pairing
          cargo clippy \
            --locked \
            --package KonclaveDomainCore \
            --package KonclaveCryptographicCore \
            --all-targets \
            -- \
            -D warnings
          bash ./scripts/ci/Validate-RustSecurityDependencies.sh
