name: Short-code pairing conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: short-code-pairing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  short-code-pairing-conformance:
    name: Short-code pairing conformance
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout component validation scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: .ci-scope
          sparse-checkout: |
            scripts/ci/ComponentValidationScope.Functions.ps1
            scripts/ci/Resolve-ComponentValidationScope.ps1
          sparse-checkout-cone-mode: false
      - name: Resolve short-code pairing validation scope
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          ./.ci-scope/scripts/ci/Resolve-ComponentValidationScope.ps1 `
            -Contract 'short-code-pairing' `
            -EventName $env:EVENT_NAME `
            -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER)
      - name: Checkout source
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Preserve the sibling scope checkout for its post-step cleanup.
          clean: false
      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: short-code-pairing-conformance
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          npm-cache-scope: short-code-pairing-conformance
          npm-cache-dependency-hash: ${{ hashFiles('extensions/Konclave.HostExtension/package-lock.json', 'packages/Konclave.ProtocolContracts.TypeScript/package-lock.json') }}
      - name: Verify short-code pairing integration
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --package KonclaveClientLibrary \
            --package KonclaveCommunityRelay \
            --package KonclaveDomainCore \
            --package KonclaveCryptographicCore \
            --package KonclaveLocalDaemon \
            --package KonclaveProtocolContracts \
            --package KonclaveRelayCore \
            -- \
            --check
          cargo test \
            --locked \
            --package KonclaveDomainCore \
            short_code
          cargo test \
            --locked \
            --package KonclaveCryptographicCore \
            short_code_pairing
          cargo test \
            --locked \
            --package KonclaveProtocolContracts \
            short_code_pairing
          cargo test \
            --locked \
            --package KonclaveRelayCore
          cargo test \
            --locked \
            --package KonclaveCommunityRelay \
            --test http_integration \
            short_code_pairing
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            --test relay_integration \
            client_completes_one_short_code_relay_exchange
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            --test http_safety \
            clients_never_forward_bearer_credentials_across_redirects
          cargo test \
            --locked \
            --package KonclaveClientLibrary \
            --test http_safety \
            short_code_client_requires_exact_status_and_bounded_snapshot
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            short_code
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            profile_schema_migrates
          cargo test \
            --locked \
            --package KonclaveLocalDaemon \
            --lib \
            copilot_tool_contract_fixture_matches_the_router
          cargo clippy \
            --locked \
            --package KonclaveClientLibrary \
            --package KonclaveCommunityRelay \
            --package KonclaveDomainCore \
            --package KonclaveLocalDaemon \
            --package KonclaveCryptographicCore \
            --package KonclaveProtocolContracts \
            --package KonclaveRelayCore \
            --all-targets \
            -- \
            -D warnings
          bash ./scripts/ci/Validate-RustSecurityDependencies.sh
          npm --prefix packages/Konclave.ProtocolContracts.TypeScript ci --no-audit --no-fund
          npm --prefix packages/Konclave.ProtocolContracts.TypeScript run build
          npm --prefix packages/Konclave.ProtocolContracts.TypeScript test
          npm --prefix extensions/Konclave.HostExtension ci --no-audit --no-fund
          npm --prefix extensions/Konclave.HostExtension test
